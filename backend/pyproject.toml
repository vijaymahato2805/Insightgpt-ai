[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightgpt-ai-backend"
version = "0.1.0"
description = "FastAPI backend foundation for InsightGPT AI"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<47",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pyodbc>=5.2,<6",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.6,<3",
  "reportlab>=4.2,<5",
  "PyJWT>=2.9,<3",
  "sqlglot>=26,<31",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "aiosqlite>=0.20,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
